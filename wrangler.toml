# Cloudflare Workers — static asset deployment for babyblocks.io
# Deploy command: npx wrangler deploy
# Build first with: cd site && npm ci && npm run build

name = "babyblocks-site"
compatibility_date = "2025-01-01"
# global_fetch_strictly_public — at the runtime level, blocks any
# fetch() to a private/link-local IP. Static-asset workers don't
# fetch user-supplied URLs today, but the flag costs nothing and
# defends against any future code path that does.
compatibility_flags = ["global_fetch_strictly_public"]

# Serve everything in site/dist as static assets (no Worker logic needed)
[assets]
directory = "./site/dist"

# Custom domains — apex + www both point at this worker.
# Cloudflare auto-creates the matching DNS records when this is deployed,
# provided babyblocks.io is in this Cloudflare account's zone list.
[[routes]]
pattern = "babyblocks.io"
custom_domain = true

# www.babyblocks.io is served via a hostname-pattern route, not a
# Custom Domain, because the CNAME flattening DNS record (www →
# babyblocks.io, proxied) conflicts with Custom Domain auto-attach.
# The route below tells Cloudflare to match any www hostname and
# route it to this same Worker.
[[routes]]
pattern = "www.babyblocks.io/*"
zone_name = "babyblocks.io"
